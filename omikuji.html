<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>白狼神籤</title>
    <style>
        body {
            background-color: #000000;
            color: #dcdcdc;
            font-family: "MS P明朝", "MS Mincho", "Hiragino Mincho ProN", serif;
            margin: 0;
            padding: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            /* 背景におみくじ筒の画像を配置 */
            background-image: linear-gradient(rgba(0, 0, 0, 0.75), rgba(0, 0, 0, 0.75)), url('omikuji_bg.jpg');
            background-size: contain;
            background-position: center;
            background-repeat: no-repeat;
        }

        .omikuji-container {
            text-align: center;
            background-color: rgba(5, 5, 5, 0.85);
            border: 1px solid #333333;
            padding: 40px 30px;
            max-width: 500px;
            width: 90%;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.8);
        }

        .title {
            font-size: 1.2em;
            color: #ffffff;
            margin-bottom: 20px;
            letter-spacing: 2px;
        }

        .draw-btn {
            background-color: #080808;
            color: #8a9ea7;
            border: 1px solid #333333;
            padding: 12px 30px;
            font-family: inherit;
            font-size: 1em;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .draw-btn:hover {
            border-color: #8a9ea7;
            color: #ffffff;
            box-shadow: 0 0 12px rgba(138, 158, 167, 0.3);
        }

        .draw-btn:disabled {
            border-color: #222222;
            color: #555555;
            cursor: not-allowed;
            box-shadow: none;
        }

        /* フェードイン表示エリア */
        .result-wrap {
            margin-top: 25px;
            display: none;
            opacity: 0;
            transition: opacity 1.5s ease-in-out;
        }

        .result-wrap.show {
            opacity: 1;
        }

        .result-img {
            max-width: 100%;
            height: auto;
            border: 1px solid #444444;
        }

        /* 画像下の説明文スタイル */
        .result-text {
            margin-top: 15px;
            font-size: 0.9em;
            color: #b0c4de;
            line-height: 1.6;
            text-align: left;
            border-top: 1px dashed #333333;
            padding-top: 15px;
        }

        .notice {
            font-size: 0.85em;
            color: #888888;
            margin-top: 15px;
        }

        .back-link {
            display: inline-block;
            margin-top: 30px;
            color: #8a9ea7;
            text-decoration: none;
            font-size: 0.9em;
        }

        .back-link:hover {
            color: #ffffff;
            text-decoration: underline;
        }
    </style>
</head>
<body>

<div class="omikuji-container">
    <div class="title">【 白狼神社で運試し 】</div>

    <button id="draw-btn" class="draw-btn">おみくじを引いてみる</button>
    <div id="notice" class="notice"></div>

    <!-- 結果表示（画像＋説明文） -->
    <div id="result-wrap" class="result-wrap">
        <img id="result-img" class="result-img" src="" alt="おみくじの結果">
        <div id="result-text" class="result-text"></div>
    </div>

    <div>
        <a href="index.html" class="back-link">← 用語集へ戻る</a>
    </div>
</div>

<script>
    document.addEventListener('DOMContentLoaded', () => {
        // 画像と説明文の完全対応データ
        const omikujiData = [
            {
                img: 'IMG_2421.jpeg', // 大吉
                text: '【大吉】今日のあなたは一味違う。風による災害も水による惨劇も今日のあなたとは無縁です。こんなに運が良いのなら普段見えないものが見えるかも。'
            },
            {
                img: 'IMG_2422.jpeg', // 吉
                text: '【吉】まずまずの運勢。けれど油断は禁物。特にお金に関しては要注意。財布に穴が空いていないか要確認。'
            },
            {
                img: 'IMG_2425.jpeg', // 小吉
                text: '【小吉】小銭ほどの幸運はすぐにこぼれ落ちます。今あるものを大事にせず、未知の事物を探しに行きましょう。'
            },
            {
                img: 'IMG_2423_2.jpeg', // 末吉
                text: '【末吉】残り物には福がある。末の福ほど良いものはありません。という考え方もできるけれど、残り物自体には価値はありません。だって誰も要らなかったのですから。'
            },
            {
                img: 'IMG_2424.jpeg', // 凶
                text: '【凶】逆に運が良いのかも。とりあえず今日のあなたはいつもと違う。その事実を受け入れて慎ましく過ごしましょう。'
            },
            {
                img: 'IMG_2420_2.jpeg', // 大凶
                text: '【大凶】早く寝ましょう。起きていれば常に嫌な目に遭います。今日は"そういう日"だと受け入れて早く寝ましょう。'
            }
        ];

        const drawBtn = document.getElementById('draw-btn');
        const notice = document.getElementById('notice');
        const resultWrap = document.getElementById('result-wrap');
        const resultImg = document.getElementById('result-img');
        const resultText = document.getElementById('result-text');

        // 今日の日付を取得 (YYYY-MM-DD)
        const today = new Date().toLocaleDateString('sv-SE');

        // ローカルストレージの確認
        const lastDrawnDate = localStorage.getItem('hakuro_omikuji_date');
        const savedIndex = localStorage.getItem('hakuro_omikuji_index');

        // 本日すでに引いている場合
        if (lastDrawnDate === today && savedIndex !== null) {
            drawBtn.disabled = true;
            drawBtn.textContent = '運試しは時間を空けて。';
            notice.textContent = 'そんなに凶を引きたいのですか？';

            const savedItem = omikujiData[savedIndex];
            resultImg.src = savedItem.img;
            resultText.textContent = savedItem.text;

            resultWrap.style.display = 'block';
            setTimeout(() => {
                resultWrap.classList.add('show');
            }, 50);
        }

        // ボタン押下時
        drawBtn.addEventListener('click', () => {
            // タブ（警告アラート）の表示
            alert('あなたも物好きですね…');

            // ランダム選択
            const randomIndex = Math.floor(Math.random() * omikujiData.length);
            const selectedItem = omikujiData[randomIndex];

            // 1日1回の記録を保存（インデックス番号を保存）
            localStorage.setItem('hakuro_omikuji_date', today);
            localStorage.setItem('hakuro_omikuji_index', randomIndex);

            // ボタンの無効化処理
            drawBtn.disabled = true;
            drawBtn.textContent = '本日はお引き取りください。長居は危険です。';
            notice.textContent = '背後を確認しなくてよろしいのですか？';

            // 内容のセットとフェードイン表示
            resultImg.src = selectedItem.img;
            resultText.textContent = selectedItem.text;

            resultWrap.style.display = 'block';
            setTimeout(() => {
                resultWrap.classList.add('show');
            }, 50);
        });
    });
</script>

</body>
</html>
