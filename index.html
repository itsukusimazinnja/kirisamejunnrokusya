<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>霧雨巡録社</title>
    
    <!-- 検索結果に表示されるサイトの説明文 -->
    <meta name="description" content="同人作家として活動している暮葉畏啓のウェブサイト。日々を綴る日記から創作物の新作情報まで多岐に渡る。">
    
    <!-- 検索ロボットにインデックス（登録）を許可する設定 -->
    <meta name="robots" content="index, follow">

    <!-- キーワード -->
    <meta name="keywords" content="霧雨巡録社,暮葉畏啓,黒羽録,百記夜行,小説,黒背景クローバーs,暮葉,東方project,怪異">
    
    <style>
        body {
            background-color: #000000;
            color: #dcdcdc;
            font-family: "MS P明朝", "MS Mincho", "Hiragino Mincho ProN", serif;
            text-align: center;
            margin: 0;
            padding: 50px 0;
            line-height: 1.8;
        }

        /* PCサイトらしい800px固定枠 */
        .container {
            width: 800px;
            margin: 0 auto;
            text-align: center;
        }

        /* ヘッダー画像のサイズ調整 */
        .header-banner {
            width: 100%;
            height: auto;
            object-fit: cover;
            margin-bottom: 30px;
        }

        a {
            color: #8a9ea7;
            text-decoration: underline;
        }
        a:hover {
            color: #ffffff;
        }

        .enter-link {
            margin: 40px 0 60px 0;
            font-size: 1.2em;
            letter-spacing: 3px;
        }

        .description {
            margin: 50px 0;
            font-size: 1em;
            line-height: 2.0;
        }

        .notice {
            margin-top: 60px;
            font-size: 0.85em;
            color: #aaaaaa;
        }
    </style>
</head>
<body>

<div class="container">

    <!-- ① トップのヘッダー画像 -->
    <div>
        <a href="main.html">
            <img src="IMG_2376.jpeg" alt="good morning" class="header-banner" onerror="this.style.display='none'">
        </a>
    </div>

    <!-- ② 本編への入口リンク -->
    <div class="enter-link">
        <a href="main.html">さぁ、始めよう。</a>
    </div>

    <!-- ③ サークルの紹介文・挨拶 -->
    <div class="description">
        <p>
            当サークル「霧雨巡録社」は、短編集を編纂したりノベルゲームを制作したりなサークルです。私が制作する奇奇怪怪な事物を世間に見せびらかして、一緒に平地人を戦慄せしめましょう!<br>
            サークル主は暮葉畏啓(くろはいけい)という只の捻くれ者です。お見知り置きを。<br>
            転載はルール違反です。知らなかったでは済みませんよ
        </p>
    </div>

    <!-- ④ 閲覧環境などの注意書き -->
    <div class="notice">
        <p>
            当世界は、横解像度800以上で見ることを推奨します。<br>
            リンクは貼ることを推奨します。出口のない入り口は通路ではありませんから。
        </p>
    </div>

</div>

</body>
</html>
