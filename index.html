<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>霧雨巡録社のページ</title>
    
    <style>
        body {
            background-color: #000000;
            color: #dcdcdc;
            font-family: "MS P明朝", "MS Mincho", "Hiragino Mincho ProN", serif;
            text-align: center;
            margin: 0;
            padding: 40px 20px;
            line-height: 1.8;
        }

        .container {
            max-width: 750px;
            margin: 0 auto;
        }

        /* ヘッダー画像の縦幅を抑制する設定 */
        .header-banner {
            max-width: 100%;
            max-height: 250px;
            object-fit: contain;
            margin-bottom: 20px;
        }

        a {
            color: #8a9ea7;
            text-decoration: underline;
        }
        a:hover {
            color: #ffffff;
        }

        .enter-link {
            margin: 30px 0 50px 0;
            font-size: 1.1em;
            letter-spacing: 2px;
        }

        .description {
            margin: 40px 0;
            font-size: 0.95em;
            text-align: center;
        }

        .notice {
            margin: 40px 0;
            font-size: 0.85em;
            color: #aaaaaa;
        }

        .banner-area {
            margin-top: 50px;
            font-size: 0.85em;
            color: #cccccc;
        }

        .code-box {
            display: inline-block;
            font-family: "Courier New", Consolas, monospace;
            font-size: 0.85em;
            color: #bbbbbb;
            margin-top: 5px;
            word-break: break-all;
        }
    </style>
</head>
<body>

<div class="container">

    <!-- ① トップのヘッダー画像 -->
    <div>
        <a href="main.html">
            <img src="IMG_2371.jpeg" alt="good morning" class="header-banner" onerror="this.style.display='none'">
        </a>
    </div>

    <!-- ② 本編への入口リンク -->
    <div class="enter-link">
        <a href="main.html">さぁ、始めよう。</a>
    </div>

    <!-- ③ サークルの紹介文・挨拶 -->
    <div class="description">
        <p>
               霧雨に打たれて大地は歪む。<br>
            筆者は鬼ごっこが大好きなようです。<br>
            転載はルール違反です、知らなかったでは済みませんよ
        </p>
    </div>

    <!-- ④ 閲覧環境などの注意書き -->
    <div class="notice">
        <p>
            当世界は、横解像度800以上で見ることを推奨します。<br>
            リンクは貼ることを推奨します。出口のない入り口は通路ではありませんから。
        </p>
    </div>

    <!-- ⑤ 相互リンク用のバナー案内 -->
    <div class="banner-area">
        <p>
            バナーは 
            <img src="IMG_2371.jpeg" alt="サークルバナー" style="vertical-align: middle;" width="200" onerror="this.style.display='none'">
            <br>
            <span class="code-box">
                &lt;img src="https://itsukusimazinnja.github.io/kirisamejunnrokusya/IMG_2371.jpeg" width=200&gt;
            </span>
            <br>
            等とお書き下さい。
        </p>
    </div>

</div>

</body>
</html>
