<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>宵の彼岸 - 記録写真</title>
    <style>
        body {
            background-color: #000000;
            color: #dcdcdc;
            font-family: "MS P明朝", "MS Mincho", "Hiragino Mincho ProN", serif;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .photo-container {
            text-align: center;
            max-width: 800px;
            width: 90%;
            padding: 20px;
        }

        /* 画像表示エリア */
        .img-wrapper {
            position: relative;
            width: 100%;
            max-width: 600px;
            margin: 0 auto;
            aspect-ratio: 4 / 3; /* 画像の比率に合わせて調整 */
            overflow: hidden;
            border: 1px solid #333333;
            background-color: #050505;
        }

        .img-wrapper img {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            opacity: 0;
            transition: opacity 1.2s ease-in-out; /* 2秒間隔に合わせてフェードを1.2秒に */
        }

        /* 表示対象の画像 */
        .img-wrapper img.active {
            opacity: 1;
        }

        /* 説明文エリア */
        .caption {
            margin-top: 25px;
            font-size: 1.1em;
            letter-spacing: 2px;
            color: #aaaaaa;
            min-height: 1.8em;
            transition: color 1.5s ease;
        }

        /* 最終段階で文字を白く光らせる演出 */
        .caption.highlight {
            color: #ffffff;
            text-shadow: 0 0 8px rgba(255, 255, 255, 0.6);
        }

        .back-link {
            margin-top: 40px;
        }

        .back-link a {
            color: #8a9ea7;
            text-decoration: none;
            font-size: 0.9em;
        }

        .back-link a:hover {
            color: #ffffff;
            text-decoration: underline;
        }


        /* 砂嵐（ノイズ）レイヤー */
.img-wrapper::after {
    content: "";
    position: absolute;
    top: -50%;
    left: -50%;
    width: 200%;
    height: 200%;
    background-image: repeating-radial-gradient(
        circle at 17% 32%,
        white,
        black 0.00085px,
        rgba(255, 255, 255, 0.05) 0.0001px,
        rgba(0, 0, 0, 0.5) 0.00025px
    );
    opacity: 0.15; /* 砂嵐の濃さ（0.1〜0.3で調整可能） */
    pointer-events: none;
    z-index: 10;
    animation: static-noise 0.2s steps(4) infinite;
}

        /* 上の黒帯 */
body::before {
    content: "";
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 60px; /* 帯の太さ（お好みで調整） */
    background-color: #000000;
    z-index: 100;
    pointer-events: none; /* 下の要素のクリックを邪魔しない */
}

/* 下の黒帯 */
body::after {
    content: "";
    position: fixed;
    bottom: 0;
    left: 0;
    width: 100%;
    height: 60px; /* 帯の太さ */
    background-color: #000000;
    z-index: 100;
    pointer-events: none;
}

/* 砂嵐の位置を高速でずらしてチカチカさせる */
@keyframes static-noise {
    0% { transform: translate(0, 0); }
    10% { transform: translate(-5%, -5%); }
    20% { transform: translate(-10%, 5%); }
    30% { transform: translate(5%, -10%); }
    40% { transform: translate(-5%, 15%); }
    50% { transform: translate(-10%, 5%); }
    60% { transform: translate(15%, 0); }
    70% { transform: translate(0, 10%); }
    80% { transform: translate(-15%, 0); }
    90% { transform: translate(10%, 5%); }
    100% { transform: translate(5%, 0); }
}

        
    </style>
</head>
<body>

<div class="photo-container">

    <div class="img-wrapper">
        <!-- IMG_2425.jpeg から 9枚分の連番 -->
        <img src="IMG_2428.jpeg" alt="宵の彼岸 記録写真" class="slide-img active">
        <img src="IMG_2429.jpeg" alt="宵の彼岸 記録写真" class="slide-img">
        <img src="IMG_2430.jpeg" alt="宵の彼岸 記録写真" class="slide-img">
        <img src="IMG_2431.jpeg" alt="宵の彼岸 記録写真" class="slide-img">
        <img src="IMG_2432.jpeg" alt="宵の彼岸 記録写真" class="slide-img">
        <img src="IMG_2433.jpeg" alt="宵の彼岸 記録写真" class="slide-img">
        <img src="IMG_2434.jpeg" alt="宵の彼岸 記録写真" class="slide-img">
        <img src="IMG_2435.jpeg" alt="宵の彼岸 記録写真" class="slide-img">
        <img src="IMG_2436.jpeg" alt="宵の彼岸 記録写真" class="slide-img">
    </div>

    <!-- 写真のテキスト -->
    <div class="caption" id="captionText">写真家 狗山五郎さん撮影</div>

    <div class="back-link">
        <a href="javascript:history.back()">← 去る</a>
    </div>

</div>

<script>
    document.addEventListener('DOMContentLoaded', () => {
        const images = document.querySelectorAll('.slide-img');
        const caption = document.getElementById('captionText');
        
        let currentIndex = 0;
        const intervalTime = 2000; // 2秒（2000ms）ごとに切り替え

        const timer = setInterval(() => {
            // 現在の画像を非表示
            images[currentIndex].classList.remove('active');
            
            currentIndex++;

            if (currentIndex < images.length) {
                // 次の画像を表示
                images[currentIndex].classList.add('active');

                // 最後の画像に達した時の演出
                if (currentIndex === images.length - 1) {
                    caption.textContent = "誰がいるの？";
                    caption.classList.add('highlight');
                }
            } else {
                // 最後の画像で停止
                images[images.length - 1].classList.add('active');
                clearInterval(timer);
            }
        }, intervalTime);
    });
</script>

</body>
</html>
